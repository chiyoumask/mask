      - "🇺🇸 US 203"
      - "🇺🇸 US 204"
      - "🇺🇸 US 205"
      - "🇺🇸 US 206"
      - "🇰🇷 KR 001"
      - "🇰🇷 KR 002"

  # Cloudflare 优选专用测速组
