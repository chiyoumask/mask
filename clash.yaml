    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "🇺🇸 US 001"
      - "🇺🇸 US 002"
      - "🇺🇸 US 003"
      - "🇺🇸 US 004"
      - "🇺🇸 US 005"
      - "🇺🇸 US 201"
