      - "🇺🇸 US 002"
      - "🇺🇸 US 003"
      - "🇺🇸 US 004"
      - "🇺🇸 US 005"

  - name: "🇰🇷 韩国节点"
    type: select
    proxies:
      - "🇰🇷 KR 001"
      - "🇰🇷 KR 002"

