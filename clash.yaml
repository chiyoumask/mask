  - name: "🚀 节点选择"
    type: select
    proxies:
      - "⚡ 自动优选"
      - "☁️ CF 优选"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "🇺🇸 US 001"
      - "🇺🇸 US 002"
      - "🇺🇸 US 003"
      - "🇺🇸 US 004"
      - "🇺🇸 US 005"
