# Clash Meta (mihomo) 手机专属配置文件
# 共 13 个节点：5 个 Cloudflare 优选（US 001-005）+ 8 个自建极速节点（AnyTLS + Hysteria2 + VLESS-Reality）
# 节点命名与参数已按 A002.yaml 对齐（US 201-206、KR 001-002）
# 适用客户端：Clash Meta for Android / Flclash / Clash Verge / Loon / Shadowrocket

port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
external-controller: 127.0.0.1:9090

# 针对移动端优化 DNS 与连接嗅探
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

