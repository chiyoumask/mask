  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "🇺🇸 US 201"
      - "🇺🇸 US 202"
      - "🇺🇸 US 203"
      - "🇺🇸 US 204"
      - "🇺🇸 US 205"
